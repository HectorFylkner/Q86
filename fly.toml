# Fly.io config for a Q86 instance. See DEPLOY.md.
#
# The volume holds ./data — the SQLite database, which contains the
# question bank, every account and the scratch photos, so that one file is
# the whole deployment's state. auto-stop keeps cost near zero when nobody
# is training.
#
# There is no release_command: the Next.js instrumentation hook applies
# pending migrations on every server boot, which is the same path Vercel
# takes. Adding one here would run the migrations twice.
app = "q86"
primary_region = "arn"

[build]
  dockerfile = "Dockerfile"

[mounts]
  source = "q86_data"
  destination = "/app/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[env]
  # Everything secret is set with `fly secrets set`, never here — this
  # file is committed. NEXT_PUBLIC_SITE_URL is the one that must be set
  # before the first real user: password-reset and referral links resolve
  # against it, and unset it points at localhost.
  NODE_ENV = "production"
